keeper: character.draughtswoman
dialogue: dialogue.draughtswoman.intro
concepts: [concept.spec, concept.verification]
mechanic: mechanic.blueprint
summary: A drawing, a mason, and the difference between a wish and a spec.
intro: >-
  The Draughtswoman unrolls a drawing: a wall sixty bricks wide and twenty
  high. "The Mason will build it," she says, "but only from a spec she can
  measure. Give her a wish and she will stand there all day."
