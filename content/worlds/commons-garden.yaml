summary: A garden of Beads planted by others, and a plot waiting for yours.
intro: >-
  The Gardener waves you into the garden. Beads stand in neat rows, each one
  planted by someone who came before. "Every one of these is a thing somebody
  chose to share," she says. "There is a plot for yours."
