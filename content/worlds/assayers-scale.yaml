summary: A scale that praises everything, and the one weight it cannot catch.
intro: >-
  The Assayer sets a gleaming scale before you. "It says everything is
  excellent," she says. "I have stopped believing it. Find me a reading that
  could disagree, and then find the weight that is wrong."
