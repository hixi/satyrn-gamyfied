id: mechanic.assayers-scale
element: mechanic-assayers-scale
title: The Assayer's Scale
description: >-
  The gleaming scale reads "excellent" for every weight. Find a check that can
  actually fail, rely on it, and mark the weight that is truly unsound.
a11y: >-
  Choose a check to rely on, then mark the unsound weight. Only a check that
  can fail proves anything. You can also continue without playing.
params:
  items:
    - { id: millers-measure, label: "the miller's measure", sound: true }
    - { id: bakers-measure, label: "the baker's measure", sound: true }
    - { id: cracked-weight, label: "the cracked weight", sound: false }
    - { id: ferrymans-measure, label: "the ferryman's measure", sound: true }
  checks:
    - { id: gleaming, label: "the gleaming scale", kind: vanity }
    - { id: assay, label: "the assay, weighed against a known good", kind: honest }
    - { id: stubborn, label: "the stubborn scale", kind: broken }
