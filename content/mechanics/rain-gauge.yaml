id: mechanic.rain-gauge
title: The Rain-Gauge
description: >-
  The terrace's cup holds only five drops, and the plants need five particular
  ones. Choose what to keep; what you keep beyond the cup spills.
a11y: >-
  For each drop, choose Keep or Let fall. The cup holds a fixed number of drops.
  You can also continue without playing.
params:
  capacity: 5
  drops:
    - { id: seed, label: "seed", essential: true }
    - { id: chatter, label: "chatter", essential: false }
    - { id: root, label: "root", essential: true }
    - { id: rumour, label: "rumour", essential: false }
    - { id: shoot, label: "shoot", essential: true }
    - { id: echo, label: "echo", essential: false }
    - { id: bloom, label: "bloom", essential: true }
    - { id: harvest, label: "harvest", essential: true }
  stars: { three: 0, two: 2 }
