id: mechanic.commons-garden
title: The Commons Garden
description: >-
  Wander a few Beads other people planted, then plant one of your own. The
  garden grows by every Bead that is added to it.
a11y: >-
  Visit a community Bead, type a name for your own, choose a seed, and plant
  it. You can also continue without playing.
params:
  seeds:
    - { id: seed-attention, name: "Attention" }
    - { id: seed-evidence, name: "Evidence" }
    - { id: seed-constraint, name: "Constraint" }
    - { id: seed-tending, name: "Tending" }
  communityBeads:
    - { id: fog-alphabet, name: "The Fog Alphabet", keeper: "a lighthouse keeper", about: "A Bead about lighting one thing at a time so the whole coast is not lost in fog." }
    - { id: long-ledger, name: "The Long Ledger", keeper: "a bookkeeper", about: "A Bead about counting what a small model spends, one turn at a time." }
    - { id: second-lantern, name: "The Second Lantern", keeper: "a night watch", about: "A Bead about keeping a spare check ready for the moment the first one fails." }
