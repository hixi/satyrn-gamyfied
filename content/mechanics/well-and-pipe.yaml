id: mechanic.well-and-pipe
title: The Well and the Pipe
description: >-
  Route each of the day's needs to your own well or to the pipe from the lake.
  Sensitive work must stay in the well, and the well holds only so much.
a11y: >-
  For each need, choose Well or Pipe. Sensitive needs must go to the well; the
  well has a fixed capacity. You can also continue without playing.
params:
  wellCapacity: 5
  tasks:
    - { id: drinking, label: "drinking water", need: 2, sensitive: true }
    - { id: bathing, label: "bathing water", need: 2, sensitive: true }
    - { id: laundry, label: "laundry", need: 3, sensitive: false }
    - { id: garden, label: "watering the garden", need: 5, sensitive: false }
  stars: { three: 0, two: 2 }
