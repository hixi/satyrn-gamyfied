id: mechanic.blueprint
element: mechanic-blueprint
title: The Blueprint and the Mason
description: >-
  Choose the clauses that make a spec the Mason can build and check. A vague
  clause leaves her waiting; the measurements must match the drawing.
a11y: >-
  Choose clauses to form a spec, then ask the Mason to build. Only measurable
  clauses can be built and checked. You can also continue without playing.
params:
  blueprint: { width: 60, height: 20 }
  clauses:
    - { id: w60, text: "60 bricks wide", kind: width, value: 60 }
    - { id: w40, text: "40 bricks wide", kind: width, value: 40 }
    - { id: h20, text: "20 bricks high", kind: height, value: 20 }
    - { id: h30, text: "30 bricks high", kind: height, value: 30 }
    - { id: sturdy, text: "sturdy enough", kind: vague }
    - { id: about-right, text: "looks about right", kind: vague }
