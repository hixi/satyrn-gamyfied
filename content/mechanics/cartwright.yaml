id: mechanic.cartwright
title: The Cartwright's Yard
description: >-
  Rig the cart so the horse reaches the market — and stops there. Fit a work
  tool, a limit, and a check; a missing piece sends it bolting or stuck.
a11y: >-
  For each slot choose a component, then send the cart. The cart must reach the
  market and stop. You can also continue without playing.
params:
  goal: 8
  slots:
    - { id: work, label: "how it works" }
    - { id: limit, label: "how far it may go" }
    - { id: check, label: "how it knows it arrived" }
  components:
    - { id: steady, name: "a steady work tool", type: work, power: 2 }
    - { id: tiny, name: "a tiny work tool", type: work, power: 1 }
    - { id: budget, name: "a turn budget", type: limit, limit: 12 }
    - { id: nudge, name: "a gentle nudge", type: distraction }
    - { id: marker, name: "a market marker", type: verify }
    - { id: bell, name: "a pretty bell", type: distraction }
  stars: { three: 0, two: 2 }
