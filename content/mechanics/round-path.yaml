id: mechanic.round-path
title: The Round Path
description: >-
  The mule's night is a list of steps. Some are this morning's work; then the
  same small circle, over and over. Mark the first full turn of the circle and
  break it — without losing the work.
a11y: >-
  Select the steps that make up one turn of the repeating circle, then choose
  Break the loop. You can also continue without playing.
params:
  cycleStart: 3
  cycleLength: 2
  steps:
    - { id: fetch-grain, label: "fetch grain" }
    - { id: grind-flour, label: "grind flour" }
    - { id: bag-flour, label: "bag flour" }
    - { id: pat-post, label: "pat the post" }
    - { id: find-nothing, label: "find nothing new" }
    - { id: pat-post-2, label: "pat the post" }
    - { id: find-nothing-2, label: "find nothing new" }
    - { id: pat-post-3, label: "pat the post" }
    - { id: find-nothing-3, label: "find nothing new" }
    - { id: pat-post-4, label: "pat the post" }
    - { id: find-nothing-4, label: "find nothing new" }
  stars: { three: 0, two: 2 }
