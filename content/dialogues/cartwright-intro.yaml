id: dialogue.cartwright.intro
start: start
nodes:
  start:
    id: start
    speaker: character.cartwright
    text: >-
      A bare horse bolts. A harnessed one arrives. Three slots stand between the
      two.
    choices:
      - id: ask
        text: What if I fit everything?
        next: answer
  answer:
    id: answer
    speaker: character.cartwright
    text: >-
      Everything includes the pretty bell. It rings, and does nothing else. The
      rig is not more parts; it is the right parts.
    choices: []
