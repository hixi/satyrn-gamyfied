id: dialogue.assayer.intro
start: start
nodes:
  start:
    id: start
    speaker: character.assayer
    text: >-
      A scale that never says no is not evidence. It is flattery with a
      needle.
    choices:
      - id: ask
        text: Then what makes a reading trustworthy?
        next: answer
  answer:
    id: answer
    speaker: character.assayer
    text: >-
      One that could have said no and did not. Build the check that can fail,
      and then trust what it tells you.
    choices: []
