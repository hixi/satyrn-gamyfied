id: dialogue.gardener.intro
start: start
nodes:
  start:
    id: start
    speaker: character.gardener
    text: >-
      You have mended a lot of machines. Would you leave the garden with nothing
      in it of yours?
    choices:
      - id: ask
        text: What if what I know is small?
        next: answer
  answer:
    id: answer
    speaker: character.gardener
    text: >-
      Small is how every row began. Plant what you learned; the next traveller
      will thank you for it.
    choices: []
