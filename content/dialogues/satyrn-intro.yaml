id: dialogue.satyrn.intro
start: start
nodes:
  start:
    id: start
    speaker: character.satyrn
    text: >-
      I am quick, but I wander. Point the lantern where you want me to look, and
      I will see only that.
    choices:
      - id: ask
        text: What can you see right now?
        next: answer
      - id: skip
        text: I have been here before. Let us move on.
        condition:
          event: world.entered
          world: world.lantern-room
  answer:
    id: answer
    speaker: character.satyrn
    text: >-
      Only the dark, until you light something. That is the whole trick of it:
      attention is what a model gets to know.
    choices: []
