id: dialogue.gatekeeper.intro
start: start
nodes:
  start:
    id: start
    speaker: character.gatekeeper
    text: >-
      "Admit the worthy." Every traveller is worthy to someone. Tell me what
      they must carry, and I will admit exactly those.
    choices:
      - id: ask
        text: What if I forget an edge case?
        next: answer
  answer:
    id: answer
    speaker: character.gatekeeper
    text: >-
      Then I will obey the gap, and let the wrong one through. I will not know
      it was a mistake. I only know the order.
    choices: []
