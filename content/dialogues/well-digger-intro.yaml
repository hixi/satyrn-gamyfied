id: dialogue.well-digger.intro
start: start
nodes:
  start:
    id: start
    speaker: character.well-digger
    text: >-
      A pipe is convenient right up until someone else turns it off, or reads
      what you sent. Which of today's needs would you mind a stranger seeing?
    choices:
      - id: ask
        text: Is the pipe ever the right choice?
        next: answer
  answer:
    id: answer
    speaker: character.well-digger
    text: >-
      Often. Use it for what is heavy and public, and keep the well for what is
      private. The mistake is sending everything one way.
    choices: []
