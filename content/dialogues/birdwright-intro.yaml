id: dialogue.birdwright.intro
start: start
nodes:
  start:
    id: start
    speaker: character.birdwright
    text: >-
      People ask me for the best bird. I ask them for the errand. There is no
      best bird, only a right one.
    choices:
      - id: ask
        text: What if one errand needs two gifts?
        next: answer
  answer:
    id: answer
    speaker: character.birdwright
    text: >-
      Then you need a bird that has both. That is why I keep such different
      kinds, and why I can lend each of them only once.
    choices: []
