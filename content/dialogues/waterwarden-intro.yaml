id: dialogue.waterwarden.intro
start: start
nodes:
  start:
    id: start
    speaker: character.waterwarden
    text: >-
      Every drop costs room. The cup does not grow. Tell me — what will you
      keep when the rain does not stop?
    choices:
      - id: ask
        text: What happens to what I let fall?
        next: answer
      - id: again
        text: I have filled this cup before.
        condition:
          event: world.entered
          world: world.rain-gauge-terrace
  answer:
    id: answer
    speaker: character.waterwarden
    text: >-
      It is gone. The model never saw it. That is not cruelty; it is simply the
      size of the cup.
    choices: []
