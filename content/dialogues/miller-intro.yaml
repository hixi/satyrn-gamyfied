id: dialogue.miller.intro
start: start
nodes:
  start:
    id: start
    speaker: character.miller
    text: >-
      Motion is not work. She takes the same two steps and learns nothing, and
      I pay for every one of them.
    choices:
      - id: ask
        text: Should I simply stop her?
        next: answer
  answer:
    id: answer
    speaker: character.miller
    text: >-
      Stop her and you lose the grain she already ground. Break the circle, and
      the morning's work still stands.
    choices: []
