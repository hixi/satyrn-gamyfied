id: dialogue.draughtswoman.intro
start: start
nodes:
  start:
    id: start
    speaker: character.draughtswoman
    text: >-
      Writing "make it good" is not a plan. The Mason cannot measure good. What
      can she measure?
    choices:
      - id: ask
        text: What if I am not sure of the number yet?
        next: answer
      - id: mason
        text: Let me ask the Mason what she needs.
        next: mason
  answer:
    id: answer
    speaker: character.draughtswoman
    text: >-
      Then you are not ready to build. A spec you cannot check is a promise you
      cannot keep.
    choices:
      - id: mason
        text: Let me ask the Mason what she needs.
        next: mason
  mason:
    id: mason
    speaker: character.mason
    text: >-
      Give me numbers I can lay a stone against, and I will build it and then
      prove it fits. Give me a wish and I will stand here, waiting, all day.
    choices: []